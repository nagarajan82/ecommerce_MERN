name: Publish Container Images to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional additional tag for published images (e.g. v1.0.0)'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish-images:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            image: gateway
            dockerfile: gateway/Dockerfile
            context: .
          - service: user-service
            image: user-service
            dockerfile: services/user-service/Dockerfile
            context: .
          - service: product-service
            image: product-service
            dockerfile: services/product-service/Dockerfile
            context: .
          - service: order-service
            image: order-service
            dockerfile: services/order-service/Dockerfile
            context: .
          - service: payment-service
            image: payment-service
            dockerfile: services/payment-service/Dockerfile
            context: .
          - service: notification-service
            image: notification-service
            dockerfile: services/notification-service/Dockerfile
            context: .
          - service: frontend-log-collector
            image: frontend-log-collector
            dockerfile: services/frontend-log-collector/Dockerfile
            context: .
          - service: frontend
            image: frontend
            dockerfile: apps/frontend/Dockerfile
            context: .
          - service: auth-mfe
            image: auth-mfe
            dockerfile: auth-mfe/Dockerfile
            context: .
          - service: catalog-mfe
            image: catalog-mfe
            dockerfile: catalog-mfe/Dockerfile
            context: .
          - service: checkout-mfe
            image: checkout-mfe
            dockerfile: checkout-mfe/Dockerfile
            context: .
          - service: orders-mfe
            image: orders-mfe
            dockerfile: orders-mfe/Dockerfile
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ecommerce_mern/${{ matrix.image }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.service }}
            org.opencontainers.image.description=MERN E-Commerce microservice (${{ matrix.service }})
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
