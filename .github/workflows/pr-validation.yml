name: PR Validation & CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: apps/frontend
            name: apps-frontend
          - package: auth-mfe
            name: auth-mfe
          - package: catalog-mfe
            name: catalog-mfe
          - package: checkout-mfe
            name: checkout-mfe
          - package: orders-mfe
            name: orders-mfe
          - package: gateway
            name: gateway
          - package: services/user-service
            name: services-user-service
          - package: services/product-service
            name: services-product-service
          - package: services/order-service
            name: services-order-service
          - package: services/payment-service
            name: services-payment-service
          - package: services/notification-service
            name: services-notification-service
          - package: services/frontend-log-collector
            name: services-frontend-log-collector
          - package: packages/observability
            name: packages-observability

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: |
            ${{ matrix.package }}/package-lock.json
            packages/*/package-lock.json

      - name: Install shared package dependencies
        if: startsWith(matrix.package, 'services/') || matrix.package == 'gateway'
        run: |
          npm ci --prefix packages/observability
          npm ci --prefix packages/event-bus

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Run unit tests with coverage
        working-directory: ${{ matrix.package }}
        env:
          CI: 'true'
        run: npm test -- --coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.name }}
          path: ${{ matrix.package }}/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 1

  sonarqube-analysis:
    name: SonarQube Cloud Analysis & Quality Gate
    needs: [unit-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-artifacts

      - name: Normalize and map coverage reports
        run: node scripts/normalize-coverage.js

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION || secrets.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY || secrets.SONAR_PROJECT_KEY }}

      - name: SonarQube Quality Gate Check
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  build-frontends:
    name: Build (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app:
          - apps/frontend
          - auth-mfe
          - catalog-mfe
          - checkout-mfe
          - orders-mfe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build production bundle
        working-directory: ${{ matrix.app }}
        env:
          CI: 'true'
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npm run build

  validate-docker-compose:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose config --quiet

  trivy-security-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy Security Scanner (Console Table)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,misconfig,secret'
          skip-dirs: '.code-review-graph,coverage,dist'

      - name: Run Trivy Security Scanner (SARIF Output)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln,misconfig,secret'
          skip-dirs: '.code-review-graph,coverage,dist'

      - name: Upload Trivy SARIF to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'trivy-fs'

      - name: Upload Trivy SARIF Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-results.sarif
          retention-days: 7

