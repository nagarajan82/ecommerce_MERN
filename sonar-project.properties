# SonarQube Cloud Monorepo Configuration
# Project Key and Organization are injected dynamically by GitHub Actions via vars.SONAR_PROJECT_KEY and vars.SONAR_ORGANIZATION
sonar.projectName=ecommerce_MERN
sonar.sourceEncoding=UTF-8

# Source and Test directories
sonar.sources=apps,auth-mfe,catalog-mfe,checkout-mfe,orders-mfe,gateway,services,packages
sonar.tests=apps,auth-mfe,catalog-mfe,checkout-mfe,orders-mfe,gateway,services,packages
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,**/__tests__/**,**/tests/**

# Exclusions from code analysis
sonar.exclusions=\
  **/*.test.js,\
  **/*.test.jsx,\
  **/*.spec.js,\
  **/*.spec.jsx,\
  **/__tests__/**,\
  **/tests/**,\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/*.html,\
  **/*.json,\
  **/*.md,\
  **/*.log,\
  **/.code-review-graph/**,\
  **/infra/**,\
  **/scripts/**,\
  **/docker-compose*.yml,\
  **/Dockerfile*

# Copy/Paste Detection exclusions for boilerplate across microfrontends and microservices
sonar.cpd.exclusions=\
  **/logger.js,\
  **/ErrorBoundary.jsx,\
  **/api.js,\
  **/elasticClient.js,\
  **/middleware/auth.js

# Coverage exclusions for entry points, server listeners, barrels, and boilerplate
sonar.coverage.exclusions=\
  **/src/config/**,\
  **/src/index.js,\
  **/src/bootstrap.js,\
  **/src/server.js,\
  **/packages/observability/src/config.js,\
  **/packages/observability/index.js,\
  **/ErrorBoundary.jsx,\
  **/logger.js

# LCOV Code Coverage Reports across all 13 tested packages
sonar.javascript.lcov.reportPaths=\
  apps/frontend/coverage/lcov.info,\
  auth-mfe/coverage/lcov.info,\
  catalog-mfe/coverage/lcov.info,\
  checkout-mfe/coverage/lcov.info,\
  orders-mfe/coverage/lcov.info,\
  gateway/coverage/lcov.info,\
  services/user-service/coverage/lcov.info,\
  services/product-service/coverage/lcov.info,\
  services/order-service/coverage/lcov.info,\
  services/payment-service/coverage/lcov.info,\
  services/notification-service/coverage/lcov.info,\
  services/frontend-log-collector/coverage/lcov.info,\
  packages/observability/coverage/lcov.info
